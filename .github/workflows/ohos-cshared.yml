# Self-contained workflow if this folder is the repository root.
name: ohos-cshared

on:
  workflow_dispatch:

concurrency:
  group: ohos-cshared
  cancel-in-progress: true

jobs:
  ohos-cshared:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
    env:
      CGO_ENABLED: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Validate layout
        run: |
          set -euo pipefail
          test -f go.mod
          test -f psiphon_bridge.go
          test -f awg-ios/cmd/persianray/export.go
          test -f xray-core/go.mod
          test -f libxray/go.mod
          test -f psiphon-ios/MobileLibrary/psi/psi.go
          test -f usque-ios/mobile/mobile.go
          test -f MobileLibrary/OHOS/build-go-ohos.sh
          echo "UNITED=$PWD" >> "$GITHUB_ENV"

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.26.3"

      - name: Setup OpenHarmony native SDK
        uses: isaced/setup-ohos@v1
        with:
          sdk-version: "6.1-Release"
          tools: minimal

      - name: Host C toolchain
        run: sudo apt-get update && sudo apt-get install -y build-essential python3 binutils

      - name: Build libpersianray_go.so
        run: |
          set -euo pipefail
          perl -pi -e 's/\r$//' MobileLibrary/OHOS/build-go-ohos.sh
          chmod +x MobileLibrary/OHOS/build-go-ohos.sh
          if [ -n "${OHOS_NDK_HOME:-}" ] && [ -d "$OHOS_NDK_HOME/native/llvm" ]; then
            export OHOS_NDK_HOME="$OHOS_NDK_HOME/native"
          elif [ -n "${OHOS_SDK:-}" ] && [ -d "$OHOS_SDK/native/llvm" ]; then
            export OHOS_NDK_HOME="$OHOS_SDK/native"
          fi
          bash MobileLibrary/OHOS/build-go-ohos.sh

      - name: Upload libpersianray_go.so (phone, arm64)
        uses: actions/upload-artifact@v4
        with:
          name: libpersianray_go-ohos-arm64
          path: |
            build/ohos-arm64/libpersianray_go.so
            build/ohos-arm64/*.h
            build/ohos-arm64/symbols.txt
          if-no-files-found: error

      - name: Upload libpersianray_go.so (emulator, x86_64)
        uses: actions/upload-artifact@v4
        with:
          name: libpersianray_go-ohos-x86_64
          path: |
            build/ohos-x86_64/libpersianray_go.so
            build/ohos-x86_64/*.h
            build/ohos-x86_64/symbols.txt
          if-no-files-found: warn
